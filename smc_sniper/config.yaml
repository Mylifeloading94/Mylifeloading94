# =====================================================================
# SMC Sniper AI Forex Trading Bot -- central configuration
# NOTHING in the strategy is hard-coded. Everything tunable lives here.
# =====================================================================

meta:
  name: "SMC Sniper AI Forex Trading Bot"
  version: "1.0.0"
  philosophy: "NO CONFIRMATION = NO TRADE"

# ---------------------------------------------------------------------
# Markets. Only these symbols are ever traded.
# yahoo: symbol used by the offline market-data engine (Yahoo chart API)
# broker: symbol string handed to the execution engine (broker-specific)
# pip: value of 1 pip in price units
# type: fx_major | fx_cross | jpy | metal   (drives the param block used)
# ---------------------------------------------------------------------
markets:
  EURUSD: {yahoo: "EURUSD=X", broker: "EURUSD", pip: 0.0001, type: fx_major}
  GBPUSD: {yahoo: "GBPUSD=X", broker: "GBPUSD", pip: 0.0001, type: fx_major}
  USDJPY: {yahoo: "USDJPY=X", broker: "USDJPY", pip: 0.01,   type: jpy}
  USDCHF: {yahoo: "USDCHF=X", broker: "USDCHF", pip: 0.0001, type: fx_major}
  USDCAD: {yahoo: "USDCAD=X", broker: "USDCAD", pip: 0.0001, type: fx_major}
  AUDUSD: {yahoo: "AUDUSD=X", broker: "AUDUSD", pip: 0.0001, type: fx_major}
  NZDUSD: {yahoo: "NZDUSD=X", broker: "NZDUSD", pip: 0.0001, type: fx_major}
  EURJPY: {yahoo: "EURJPY=X", broker: "EURJPY", pip: 0.01,   type: jpy}
  GBPJPY: {yahoo: "GBPJPY=X", broker: "GBPJPY", pip: 0.01,   type: jpy}
  EURGBP: {yahoo: "EURGBP=X", broker: "EURGBP", pip: 0.0001, type: fx_cross}
  AUDJPY: {yahoo: "AUDJPY=X", broker: "AUDJPY", pip: 0.01,   type: jpy}
  CADJPY: {yahoo: "CADJPY=X", broker: "CADJPY", pip: 0.01,   type: jpy}
  XAUUSD: {yahoo: "GC=F",     broker: "XAUUSD", pip: 0.1,    type: metal}
  # --- v2 additions -------------------------------------------------------
  # 16 further liquid crosses the broker actually offers (confirmed against
  # /trade/accounts/{id}/instruments). They are here for one reason: the v1
  # universe produced ~1.2 trades a week, which is too thin to measure. Every
  # one of them is validated on TRAIN and TEST exactly like the original 13 --
  # see reports/tuning/round_c.csv. Exotics, indices and crypto were NOT added:
  # the spec is a forex system and their cost/behaviour is different in kind.
  AUDCAD: {yahoo: "AUDCAD=X", broker: "AUDCAD", pip: 0.0001, type: fx_cross}
  AUDCHF: {yahoo: "AUDCHF=X", broker: "AUDCHF", pip: 0.0001, type: fx_cross}
  AUDNZD: {yahoo: "AUDNZD=X", broker: "AUDNZD", pip: 0.0001, type: fx_cross}
  CADCHF: {yahoo: "CADCHF=X", broker: "CADCHF", pip: 0.0001, type: fx_cross}
  CHFJPY: {yahoo: "CHFJPY=X", broker: "CHFJPY", pip: 0.01,   type: jpy}
  EURAUD: {yahoo: "EURAUD=X", broker: "EURAUD", pip: 0.0001, type: fx_cross}
  EURCAD: {yahoo: "EURCAD=X", broker: "EURCAD", pip: 0.0001, type: fx_cross}
  EURCHF: {yahoo: "EURCHF=X", broker: "EURCHF", pip: 0.0001, type: fx_cross}
  EURNZD: {yahoo: "EURNZD=X", broker: "EURNZD", pip: 0.0001, type: fx_cross}
  GBPAUD: {yahoo: "GBPAUD=X", broker: "GBPAUD", pip: 0.0001, type: fx_cross}
  GBPCAD: {yahoo: "GBPCAD=X", broker: "GBPCAD", pip: 0.0001, type: fx_cross}
  GBPCHF: {yahoo: "GBPCHF=X", broker: "GBPCHF", pip: 0.0001, type: fx_cross}
  GBPNZD: {yahoo: "GBPNZD=X", broker: "GBPNZD", pip: 0.0001, type: fx_cross}
  NZDCAD: {yahoo: "NZDCAD=X", broker: "NZDCAD", pip: 0.0001, type: fx_cross}
  NZDCHF: {yahoo: "NZDCHF=X", broker: "NZDCHF", pip: 0.0001, type: fx_cross}
  NZDJPY: {yahoo: "NZDJPY=X", broker: "NZDJPY", pip: 0.01,   type: jpy}

# ---------------------------------------------------------------------
# Market data engine
# ---------------------------------------------------------------------
data:
  # tradelocker = the real execution venue (BID bars, deepest intraday history).
  # yahoo       = credential-free fallback (mid bars, much shorter intraday).
  provider: tradelocker
  fallback_provider: yahoo
  cache_dir: "smc_data"
  request_sleep_s: 1.0
  retries: 6

  tradelocker:
    base_url: "https://demo.tradelocker.com/backend-api"
    env_file: ".env"           # gitignored; holds TL_* creds. NEVER committed.
    read_only: true            # only /instruments, /quotes, /history are called
    bar_source: "BID"

  yahoo:
    base_url: "https://query2.finance.yahoo.com/v8/finance/chart/"
    user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"

  # How far back to request per interval IN ONE CALL. These are per-request
  # caps, NOT history limits -- a single /trade/history call returns at most
  # ~20-27k bars and answers an over-long range with an EMPTY payload rather
  # than a truncated one. Reading that empty payload as "history ends here" is
  # how this repo believed for two versions that only ~120 days of 5m existed.
  #
  # The broker actually serves 5m at least 700 days back and 1m at least 200.
  # Use `fetch_deep.py` (chunked) for anything deeper than one call:
  #     python3 fetch_deep.py --interval 5m --days 700
  request_days:
    "1D": 2000
    "1H": 1200
    "15m": 180
    "5m": 70
    "1m": 8

  # Observed live broker spreads (pips) sampled from /trade/quotes during a
  # liquid session, kept for reference only. The backtester deliberately uses
  # the WIDER execution.spreads block below -- overestimating cost is the safe
  # direction, and these raw-account quotes are not representative of news or
  # rollover conditions.
  observed_broker_spreads_pips:
    EURUSD: 0.10
    GBPUSD: 0.10
    USDJPY: 0.10
    USDCHF: 0.30
    USDCAD: 0.10
    AUDUSD: 0.40
    NZDUSD: 0.10
    EURJPY: 0.30
    GBPJPY: 1.10
    EURGBP: 0.20
    AUDJPY: 1.00
    CADJPY: 0.20
    XAUUSD: 2.50
    # v2 crosses, sampled 2026-08-14 during London
    AUDCAD: 0.70
    AUDCHF: 0.50
    AUDNZD: 0.90
    CADCHF: 0.50
    CHFJPY: 1.00
    EURAUD: 1.20
    EURCAD: 0.80
    EURCHF: 0.10
    EURNZD: 1.40
    GBPAUD: 1.10
    GBPCAD: 0.60
    GBPCHF: 0.50
    GBPNZD: 1.60
    NZDCAD: 0.70
    NZDCHF: 0.40
    NZDJPY: 0.60

# ---------------------------------------------------------------------
# Timeframe stacks. The engine is timeframe-agnostic; a "stack" names
# which TF plays which role. Two stacks are shipped:
#   spec  -- exactly what the owner spec asks for (4H bias/1H structure/
#            15M setup/5M entry). Limited to ~60 days by Yahoo.
#   long  -- same engine one notch up (1D bias/4H structure/1H setup/
#            1H entry) so we get ~2 years and a statistically usable n.
# ---------------------------------------------------------------------
stacks:
  # HEADLINE. Exactly the spec's timeframe stack. ~400 days of broker 15m bars.
  # Entry/management resolution is 15m: coarser than 5m, which makes fills
  # STRICTLY more pessimistic (more ambiguous bars, and ambiguity = loss).
  sniper:
    bias_tf: "4H"
    structure_tf: "1H"
    setup_tf: "15m"
    entry_tf: "15m"
    history_note: "~400 days of TradeLocker 15m bars (broker feed, BID)."

  # PRECISION CHECK. Same setups, 5m fill/management resolution. Only ~120 days
  # of 5m history exists, so this is a robustness check on the fill model --
  # not an independent result.
  sniper_5m:
    bias_tf: "4H"
    structure_tf: "1H"
    setup_tf: "15m"
    entry_tf: "5m"
    history_note: "~120 days -- 5m depth limit. Fill-model robustness check only."

  # LONG-WINDOW. Same engine one notch up, ~1200 days of 1H bars. Used for
  # walk-forward and regime robustness where n matters more than granularity.
  swing:
    bias_tf: "1D"
    structure_tf: "4H"
    setup_tf: "1H"
    entry_tf: "1H"
    history_note: "~1200 days of TradeLocker 1H bars."

  # ------------------------------------------------------------------
  # v3 SCALPING STACKS. Intraday, same engine, two notches down.
  #
  # These exist because `fetch_deep.py` showed the broker serves 5m bars at
  # least 700 days back once the request is chunked -- the old "~120 days of
  # 5m" note was a per-request bar cap misread as a history limit. That single
  # correction is what makes a 5m stack validatable at all.
  # ------------------------------------------------------------------

  # 15m setup, 5m entry/management resolution. The spec's sniper stack with a
  # genuinely finer fill model underneath it.
  scalp15:
    bias_tf: "4H"
    structure_tf: "1H"
    setup_tf: "15m"
    entry_tf: "5m"
    history_note: "~700 days of TradeLocker 15m bars, 5m fills."

  # HEADLINE SCALPING STACK. 5m setup -- a true intraday scalp shape.
  scalp5:
    bias_tf: "1H"
    structure_tf: "15m"
    setup_tf: "5m"
    entry_tf: "5m"
    history_note: "~700 days of TradeLocker 5m bars."

active_stack: "sniper"

# ---------------------------------------------------------------------
# Market structure
# ---------------------------------------------------------------------
structure:
  swing_lookback: 2          # fractal strength (bars each side)
  min_swings_for_bias: 4     # need this many confirmed swings before a bias is valid
  bos_confirm_close: true    # BOS requires a CLOSE beyond the swing, not a wick
  choch_confirm_close: true
  mss_requires_displacement: true
  displacement:
    atr_period: 14
    # displacement candle body must exceed this * ATR
    min_body_atr: 0.85
    # and body must be at least this fraction of the candle range
    min_body_ratio: 0.55
    lookback_bars: 5         # displacement must occur within N bars of the sweep

# ---------------------------------------------------------------------
# Liquidity
# ---------------------------------------------------------------------
liquidity:
  equal_level_tolerance_atr: 0.12   # highs within 0.12*ATR of each other == equal highs
  equal_level_min_touches: 2
  pool_lookback_bars: 120
  sweep:
    # wick must pierce the pool by >= this * ATR ...
    min_pierce_atr: 0.05
    # ... and the bar must CLOSE back on the origin side (failed breakout)
    require_close_back: true
    max_bars_since_sweep: 6        # setup must form within N bars of the sweep
  session_levels: true              # track Asian/London/NY highs & lows
  daily_levels: true                # PDH / PDL
  weekly_levels: true               # PWH / PWL

# ---------------------------------------------------------------------
# Order blocks
# ---------------------------------------------------------------------
order_blocks:
  lookback_bars: 40
  require_displacement: true       # OB only valid if followed by displacement leg
  max_age_bars: 60
  mitigation_invalidates: true     # once fully traded through, OB is dead
  min_quality: 2                   # 0-4 quality rank; below this the OB is ignored
  use_breaker_blocks: true
  use_mitigation_blocks: true

# ---------------------------------------------------------------------
# Fair value gaps
# ---------------------------------------------------------------------
fvg:
  min_size_atr: 0.18          # gap must be >= 0.18 * ATR (ATR-scaled, never flat pips)
  max_age_bars: 40
  fill_pct_invalidate: 0.85   # >85% filled == consumed
  entry_fill_pct: 0.5         # limit sits at this depth into the gap
  max_distance_atr: 2.5       # ignore zones further than this from current price

# ---------------------------------------------------------------------
# Entry order handling
# ---------------------------------------------------------------------
entry:
  order_type: "limit"     # price must RETRACE into the zone -- no chasing
  valid_bars: 8           # limit is cancelled if unfilled after N setup bars
  # The OB/FVG must form at or after the sweep, so it belongs to the reversal
  # leg. The spec's sequence is sweep -> displacement -> MSS -> THEN the zone
  # forms; without this a stale block from 60 bars ago satisfies step 7 while
  # having nothing to do with the setup that is being traded.
  zone_must_form_after_sweep: true
  # A touch is NOT a fill. Price must trade THROUGH the limit. This single
  # rule is the difference between an honest 45% and a published 70% in this
  # repo's history. Non-negotiable -- see execution.require_trade_through.

# ---------------------------------------------------------------------
# Premium / discount (equilibrium of the current structural leg)
# ---------------------------------------------------------------------
premium_discount:
  enabled: true
  equilibrium: 0.5
  # SOFT rule: a long outside discount does not get vetoed, it just loses
  # the +5 points. Hard veto only past this extreme.
  hard_veto_beyond: 0.85      # never buy above 85% of the leg, never sell below 15%

# ---------------------------------------------------------------------
# Scoring engine. Threshold decides the trade.
#
# NOTE, and this matters when reading any score: the spec describes a "0-100"
# scale, but the component weights it lists sum to 95, not 100. They are kept
# here VERBATIM rather than quietly rescaled to 100, because rescaling would
# silently move every threshold. So the real ceiling is 95, and the gates mean:
#     conservative 85  = 89% of maximum
#     standard     80  = 84% of maximum   (default)
#     aggressive   75  = 79% of maximum
# A perfect setup scores 95. Nothing can ever score 100.
# ---------------------------------------------------------------------
scoring:
  max_possible: 95
  weights:
    htf_aligned: 15
    mss_choch: 10
    bos: 10
    major_sweep: 15
    pd_pw_liquidity: 5
    valid_ob: 10
    valid_fvg: 10
    premium_discount: 5
    displacement: 5
    ltf_confirmation: 5
    favorable_spread: 5
  profiles:
    conservative: 85
    standard: 80
    aggressive: 75
  active_profile: "standard"

# ---------------------------------------------------------------------
# Risk management. This layer outranks the win rate.
# ---------------------------------------------------------------------
risk:
  account_currency: "USD"
  starting_balance: 10000.0
  risk_per_trade_pct: 0.5        # allowed range 0.25 - 1.0
  risk_per_trade_min_pct: 0.25
  risk_per_trade_max_pct: 1.0
  max_daily_loss_pct: 2.0
  max_weekly_loss_pct: 5.0
  max_open_positions: 3
  max_trades_per_day: 3
  # Whether max_open_positions / max_exposure_per_currency are ENFORCED in the
  # backtester. Both were read by the risk engine and written by nothing, so
  # both were inert -- which is the real reason v2 measured "raising the caps
  # changes nothing" and read it as setup scarcity. Enforcement defaults OFF
  # only so v2's published numbers stay reproducible bit-for-bit; the scalp
  # profile turns it ON, because at 2% risk six concurrent positions is 12% of
  # the account live at once.
  enforce_concurrency: false
  max_consecutive_losses: 4      # trips a cooldown, never a size-up
  consecutive_loss_cooldown_hours: 24
  max_exposure_per_currency: 2    # max simultaneous positions sharing a currency
  compounding: false             # fixed-fractional on the running balance if true
  # explicitly banned behaviours -- asserted in tests
  martingale: false
  grid: false
  revenge_trading: false

# ---------------------------------------------------------------------
# Stop loss / take profit
# ---------------------------------------------------------------------
stops:
  mode: "structural"          # structural | atr
  atr_period: 14
  buffer_atr: 0.25            # buffer beyond the sweep extreme
  min_stop_atr: 0.80          # never a hair-thin stop
  max_stop_atr: 3.0           # skip the setup if structure demands a huge stop
  never_widen: true
  # EXECUTION VIABILITY. Risk must be at least this many multiples of the
  # round-trip cost (spread + slippage), or the setup is skipped.
  #
  # This gate was added after measurement, not taste. With min_stop_atr at
  # 0.35 the median trade's true risk was 17.5% larger than its planned risk
  # purely from cost, and on gold the spread reached 30-100% of the stop. A
  # nominal 4R target was really collecting ~3.4R while every loss paid a full
  # -1R, which alone accounted for the negative expectancy. A setup whose
  # spread is a third of its risk is not a setup, it is noise.
  min_stop_over_cost: 10.0

targets:
  mode: "liquidity"           # liquidity | fixed_rr
  fixed_rr: 3.0
  min_rr: 2.0                 # below 1:2 -> skip the trade entirely
  preferred_rr_max: 4.0
  tp1_internal_liquidity: true
  tp2_previous_swing: true
  tp3_external_liquidity: true
  # A liquidity target only counts if it is at least this many R away.
  # Without a floor, "nearest liquidity" is almost always a trivial micro-swing
  # and every trade collapses into a sub-1R scalp with a flattering win rate.
  tp_min_r: [1.0, 2.0, 3.0]
  # fallback R multiples used when no liquidity target exists at that leg
  tp_fallback_r: [1.5, 3.0, 5.0]
  partial_tp:
    enabled: true
    tp1_close_pct: 0.5
    tp2_close_pct: 0.3
    # remainder rides to TP3 / trail
  breakeven:
    enabled: true
    trigger_r: 1.0
    offset_r: 0.05            # BE + a hair, to cover the spread
  trailing:
    enabled: true
    mode: "structure"         # structure | atr
    atr_mult: 1.5
    start_after_r: 2.0
  max_hold_bars: 96           # time stop, counted on the ENTRY timeframe
  # v3 SCALPING: be flat by the end of the session. Disabled by default so the
  # v2 swing stack is bit-for-bit unchanged. This touches exits, so it is only
  # ever adopted alongside a fresh matched-R control.
  intraday:
    enabled: false
    flat_by_utc_hour: 21      # NY close-ish; the deadline rolls to the next
                              # UTC day when the fill is already past it

# ---------------------------------------------------------------------
# Sessions (UTC hours, [start, end) )
# ---------------------------------------------------------------------
sessions:
  enabled: true
  definitions:
    asian:   {start: 0,  end: 7}
    london:  {start: 7,  end: 12}
    ny:      {start: 12, end: 17}
    late_ny: {start: 17, end: 21}
    dead:    {start: 21, end: 24}
  allowed: ["london", "ny"]
  avoid_low_liquidity: true
  # session filters have INVERTED between train and test in this repo before.
  # Treated as a hypothesis: validated in walk-forward, never assumed.
  treat_as_hypothesis: true
  skip_friday_after_utc: 20
  skip_sunday_open: true

# ---------------------------------------------------------------------
# News blackout. No historical calendar is available offline; supply a
# CSV (utc_timestamp,impact,event) via calendar_file to activate it.
# ---------------------------------------------------------------------
news:
  enabled: true
  calendar_file: null          # e.g. "smc_data/calendar.csv"
  blackout_minutes_before: 30
  blackout_minutes_after: 30
  high_impact_events:
    ["FOMC", "CPI", "NFP", "RATE_DECISION", "GDP", "PCE", "PPI", "UNEMPLOYMENT"]
  on_missing_calendar: "warn"  # warn | fail -- backtests run WITHOUT news filtering

# ---------------------------------------------------------------------
# Execution / costs. Spreads in pips, per side; commission per lot RT.
# ---------------------------------------------------------------------
execution:
  broker: "paper"              # paper | tradelocker
  max_spread_pips_default: 2.0
  max_slippage_pips: 1.0
  slippage_model: "fixed"      # fixed | atr
  slippage_pips: 0.2
  commission_per_lot_rt: 7.0
  require_trade_through: true  # a touch is NOT a fill. Non-negotiable.
  same_bar_tp_and_sl: "loss"   # ambiguous bar resolves against us. Non-negotiable.
  # Typical retail spreads used by the backtester (pips)
  spreads:
    EURUSD: 0.6
    GBPUSD: 0.9
    USDJPY: 0.7
    USDCHF: 1.1
    USDCAD: 1.2
    AUDUSD: 0.9
    NZDUSD: 1.4
    EURJPY: 1.3
    GBPJPY: 2.0
    EURGBP: 1.1
    AUDJPY: 1.6
    CADJPY: 2.0
    XAUUSD: 25.0     # 2.5 "dollars" == 25 gold pips at pip=0.1
    # v2 crosses. Live quotes sampled from /trade/quotes during London are in
    # observed_broker_spreads_pips above; these are ~3x wider, same deliberate
    # over-estimate as the original 13.
    AUDCAD: 2.0
    AUDCHF: 1.8
    AUDNZD: 2.4
    CADCHF: 1.8
    CHFJPY: 2.4
    EURAUD: 2.8
    EURCAD: 2.2
    EURCHF: 1.2
    EURNZD: 3.2
    GBPAUD: 2.8
    GBPCAD: 2.0
    GBPCHF: 1.8
    GBPNZD: 3.6
    NZDCAD: 2.0
    NZDCHF: 1.6
    NZDJPY: 1.8
  spread_widen_session:
    asian: 1.3       # multiplier applied outside London/NY
    dead: 2.0

# ---------------------------------------------------------------------
# Per-instrument parameter overrides. Gold NEVER shares EURUSD params.
# Anything not listed inherits the global block above.
# ---------------------------------------------------------------------
instrument_overrides:
  XAUUSD:
    stops:
      buffer_atr: 0.40
      min_stop_atr: 0.50
      max_stop_atr: 3.5
    fvg:
      min_size_atr: 0.25
    structure:
      displacement:
        min_body_atr: 1.0
    risk:
      risk_per_trade_pct: 0.35     # smaller risk on the most volatile instrument
    sessions:
      allowed: ["london", "ny", "late_ny"]   # gold runs late in NY
    execution:
      max_spread_pips_default: 35.0
    targets:
      min_rr: 2.0
  GBPJPY:
    execution:
      max_spread_pips_default: 3.5
    stops:
      buffer_atr: 0.30
  AUDJPY:
    execution:
      max_spread_pips_default: 3.0
  CADJPY:
    execution:
      max_spread_pips_default: 3.5
  EURGBP:
    # quiet cross: thresholds are ATR-scaled already, only the spread cap differs
    execution:
      max_spread_pips_default: 2.0
  # v2 crosses. Every threshold in the engine is ATR-scaled, so the only thing
  # that has to be widened per instrument is the spread ACCEPTANCE cap -- set
  # ~1.5x each pair's own configured spread, the same ratio GBPJPY already used.
  AUDCAD: {execution: {max_spread_pips_default: 3.0}}
  AUDCHF: {execution: {max_spread_pips_default: 2.7}}
  AUDNZD: {execution: {max_spread_pips_default: 3.6}}
  CADCHF: {execution: {max_spread_pips_default: 2.7}}
  CHFJPY: {execution: {max_spread_pips_default: 3.6}}
  EURAUD: {execution: {max_spread_pips_default: 4.2}}
  EURCAD: {execution: {max_spread_pips_default: 3.3}}
  EURCHF: {execution: {max_spread_pips_default: 2.0}}
  EURNZD: {execution: {max_spread_pips_default: 4.8}}
  GBPAUD: {execution: {max_spread_pips_default: 4.2}}
  GBPCAD: {execution: {max_spread_pips_default: 3.0}}
  GBPCHF: {execution: {max_spread_pips_default: 2.7}}
  GBPNZD: {execution: {max_spread_pips_default: 5.4}}
  NZDCAD: {execution: {max_spread_pips_default: 3.0}}
  NZDCHF: {execution: {max_spread_pips_default: 2.4}}
  NZDJPY: {execution: {max_spread_pips_default: 2.7}}

# ---------------------------------------------------------------------
# Subgroup filters (v2). Every one of these can only ever REMOVE a setup --
# none of them can create a trade the base engine would not have taken, and
# none of them can widen a risk limit.
#
# They are applied inside the signal engine BEFORE the dedupe cooldown, so a
# filtered-out setup never consumes the cooldown slot of a setup that would
# actually be traded. Applying them after dedupe would silently suppress good
# setups and make the filter look worse than it is.
#
# Empty / null everywhere == the v1 baseline, bit for bit.
# ---------------------------------------------------------------------
filters:
  # ADOPTED v2. Sweeps of SESSION EXTREMES are not traded.
  #
  # Pre-registered from the v1 adaptive layer, which found session-high sweeps
  # decisively negative (n=34, PF 0.456, -0.331R, 95% CI entirely below zero).
  # Confirmed on TRAIN before adoption: session highs n=21, PF 0.368, -0.377R,
  # CI [-0.719, -0.023]; session lows n=12, -0.088R. Removed as a CLASS rather
  # than keeping the one positive-looking side, because a one-sided cut of a
  # symmetric pool type is a fit, not a filter.
  #
  # Effect, measured on TRAIN and TEST independently (13-pair universe):
  #   TRAIN expectancy +0.011R -> +0.179R   (PF 1.022 -> 1.405)
  #   TEST  expectancy +0.002R -> +0.145R   (PF 0.996 -> 1.330)
  # It is the only change in v2 that improved both splits on its own.
  liquidity_exclude: ["session_high", "session_low"]
  # Whitelist of pool kinds. null == no whitelist (all kinds allowed).
  liquidity_include: null
  # Allowed trade directions: null == both. e.g. ["bullish"] for longs only.
  directions: null
  # UTC hours of the setup bar that may not trade.
  hours_exclude: []
  # v3 HARD GATES. Each promotes a scoring component that is normally worth
  # points into a pass/fail requirement. Removal-only: none of them can create
  # a setup the base engine would not have produced. All default to false, so
  # the v2 swing stack is bit-for-bit unchanged.
  require_structure_alignment: false   # structure TF bias must agree, not just bias TF
  require_ltf_confirmation: false      # entry-TF displacement confirmation is mandatory
  require_major_sweep: false           # only equal levels / PD / PW / session extremes
  require_ob_and_fvg: false            # the FVG must sit inside an order block
  # Volatility-regime band. The setup bar's ATR is ranked (percentile) against
  # a TRAILING window of that instrument's own ATR, shifted one bar, so the
  # band is instrument-neutral and lookahead-free. null on both = no gate.
  atr_pct_min: null
  atr_pct_max: null
  atr_pct_window: 500
  # Early structural invalidation: close the position when the SETUP timeframe
  # prints a BOS/MSS/CHoCH against the trade after entry, instead of waiting
  # for the full stop. Uses only bars whose close_time has passed -- the exit
  # fills at the next entry bar's close, never at the event bar's own close.
  structural_invalidation:
    enabled: false
    kinds: ["MSS", "BOS"]
    # Do not bail out once the trade is already in profit past this R -- by
    # then break-even/trailing management already protects it and a structural
    # wobble is not a reason to give up a runner.
    max_r_to_exit: 0.5

# ---------------------------------------------------------------------
# CONFIG PROFILES (v3). A profile is a flat map of dotted paths applied on top
# of the defaults by `Config.apply_profile(name)`. Profiles exist so the v3
# scalper can be selected without editing a single default the v2 swing stack
# is validated against -- `python3 run_backtest.py --stack swing` must keep
# returning 153 trades / 54.90% WR / PF 1.260 forever, and it does.
#
# Every value marked TUNED was selected on TRAIN only and then scored on an
# untouched TEST. The full log is reports/scalp/improvements.csv.
# ---------------------------------------------------------------------
profiles:
  # -------------------------------------------------------------------
  # swing_4r -- v2's flat-4R lead, VALIDATED and adoptable.
  #
  # v2's matched-R control noticed that a flat 4R target returned +0.263R
  # against the liquidity ladder's +0.114R, and refused to adopt it because a
  # matched-R sweep is scored on the FULL WINDOW -- the one selection this repo
  # forbids. tune_v2_leads.py gave it the TRAIN/TEST cycle it needed:
  #
  #             TRAIN      TEST       full window
  #   ladder    +0.1089    +0.0825    +0.114R, PF 1.260, 54.90% WR
  #   flat 3R   +0.1450    +0.2526    +0.192R, PF 1.284, 36.00% WR
  #   flat 4R   +0.1577    +0.5026    +0.263R, PF 1.375, 32.89% WR
  #
  # It helps TRAIN and it improves TEST, and the effect is monotonic in target
  # width rather than appearing at one convenient value -- which is what
  # separates this from lead (a), the cost gate, that did NOT replicate.
  #
  # READ THE COSTS BEFORE SELECTING IT:
  #   * win rate falls 54.90% -> 32.89%. It makes money by winning bigger, not
  #     more often. Anyone who wants a high win rate wants the ladder.
  #   * max drawdown rises 3.98% -> 7.31%.
  #   * the expectancy CI is [-0.042, +0.574]. The negative tail is narrower
  #     than the ladder's -0.061, but it STILL SPANS ZERO. This is a better
  #     configuration, not an established edge.
  #
  # It is a profile rather than a default so `--stack swing` keeps reproducing
  # v2's published 153 / 54.90% / 1.260 exactly.
  swing_4r:
    active_stack: "swing"
    targets.mode: "fixed_rr"
    targets.fixed_rr: 4.0
    targets.min_rr: 2.0
    targets.partial_tp.enabled: false
    targets.breakeven.enabled: false
    targets.trailing.enabled: false

  scalp:
    active_stack: "scalp15"

    # -- frequency. v2's caps never bound, because the swing stack produced
    # ~1.2 trades a WEEK. A scalper aiming at 3 trades a DAY hits every one of
    # them, so they are raised until setup supply is again the binding
    # constraint rather than the risk engine.
    risk.max_trades_per_day: 12
    risk.max_open_positions: 6
    risk.max_exposure_per_currency: 3
    risk.enforce_concurrency: true
    # A 24h cooldown after 4 losses deletes an entire trading day from a system
    # that trades several times a day. v2 measured loss-streak throttling as
    # harmful; this keeps a circuit breaker but sizes it to the timeframe.
    risk.max_consecutive_losses: 6
    risk.consecutive_loss_cooldown_hours: 4

    # -- scalping shape: flat by the end of the NY session, hard time stop at
    # 8 hours of 5m entry bars.
    targets.intraday.enabled: true
    targets.intraday.flat_by_utc_hour: 21
    targets.max_hold_bars: 96

    # -- gates. TUNED on TRAIN in rounds S1-S3; TEST reported, never selected on.
    #
    # scoring.threshold 55: v2's gate of 80 does not transfer. On a 15m setup it
    # starves the stack to 0.38 trades/day AND is the WORST setting on TRAIN
    # (-0.271R vs -0.105R at 55). Across the whole 55-80 range the win rate
    # moves only 41-44% -- the score card carries no positive marginal
    # information at this timeframe -- so the gate is set to the value that
    # meets the owner's 3-trades-a-day floor (3.78/day) rather than to a
    # quality level it cannot deliver.
    #
    # min_stop_over_cost 6.0: TRAIN improves monotonically as this rises
    # (-0.240R at 0x to -0.011R at 20x) and TEST does not follow (-0.205R at
    # 20x). That is sample shrinkage, not edge, so the gate is NOT tightened to
    # chase it. 6x keeps the cost drag bounded without pretending the trend is
    # real.
    #
    # READ THIS BEFORE USING THE PROFILE: at these settings the stack measures
    # -0.131R per trade over 1888 trades, negative on TRAIN and TEST
    # independently. It is here to be reproducible, not to be traded.
    scoring.threshold: 55
    stops.min_stop_over_cost: 6.0

# ---------------------------------------------------------------------
# Duplicate-setup protection
# ---------------------------------------------------------------------
dedupe:
  enabled: true
  cooldown_bars: 8               # same pair+direction cooldown on the setup TF
  same_zone_tolerance_atr: 0.35  # a re-signal inside this band is the SAME setup
  max_signals_per_setup_id: 1

# ---------------------------------------------------------------------
# Backtest / validation protocol
# ---------------------------------------------------------------------
backtest:
  # Per-pair signal generation is embarrassingly parallel (the portfolio risk
  # engine still runs sequentially afterwards, so results are identical).
  n_jobs: 4
  train_fraction: 0.50
  validation_fraction: 0.20
  test_fraction: 0.30
  walk_forward:
    enabled: true
    folds: 5
    train_bars_frac: 0.5
    anchored: false
  bootstrap_iterations: 5000
  bootstrap_ci: 0.95
  # Pair selection is done on TRAIN ONLY and then frozen. Never on the full window.
  pair_selection:
    enabled: true
    on: "train"
    min_trades: 12
    metric: "expectancy_r"
    min_metric: 0.0
  perturbation_checks:
    enabled: true
    params: ["scoring.threshold", "stops.buffer_atr", "fvg.min_size_atr", "structure.swing_lookback"]

# ---------------------------------------------------------------------
# Telegram (dry-run: no token exists, nothing is ever sent)
# ---------------------------------------------------------------------
telegram:
  enabled: false
  dry_run: true
  bot_token_env: "TELEGRAM_BOT_TOKEN"   # read from env, NEVER committed
  chat_id_env: "TELEGRAM_CHAT_ID"
  show_balance: false
  notify:
    new_signal: true
    entry_filled: true
    tp_hit: true
    breakeven_moved: true
    sl_hit: true
    daily_summary: true
    error: true

# ---------------------------------------------------------------------
# Logging / dashboard
# ---------------------------------------------------------------------
logging:
  dir: "reports"
  log_rejected_setups: true      # every rejection with reason + score + state
  level: "INFO"

dashboard:
  enabled: true
  output: "reports/dashboard.html"
  recent_signals: 40
  recent_rejections: 60

# ---------------------------------------------------------------------
# Adaptive layer (analysis only -- can never widen a risk limit)
# ---------------------------------------------------------------------
adaptive:
  enabled: true
  min_trades_for_significance: 30
  dimensions: ["pair", "session", "setup_type", "liquidity_type", "rr_bucket", "volatility_regime"]
  can_override_risk: false
